# Default training config (matches the original ecg-fm-benchmarking)
train:
  epochs: 100
  lr: 1e-3
  lr_min: 1e-6
  weight_decay: 1e-3
  warmup_epochs: 0          # paper uses const schedule
  lr_schedule: const        # const | cosine | warmup_cos
  discriminative_lr_factor: 0.1
  device: cuda

# default eval_mode
# linear_probe | attention_probe | finetune_linear | finetune_attention
eval_mode: linear_probe

# Head config
head:
  dropout: 0.0
  num_heads: 16    # attention head (for) (paper: heads=16)
  hidden_dim: 256  # mlp head (for)

# Fold split (ecg-fm-benchmarking identical )
# strat_fold column table CSV in if present, automatic use
# train = fold < max-1, val = max-1, test = max
fold:
  col: strat_fold        # fold column name
  auto_split: true       # true then max_fold based automatic split

# save
save_dir: null  # null → ./results/{task_name}_{eval_mode}_{timestamp}

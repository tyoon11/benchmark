# MIMIC-IV-ECG Lab values (regression, 18 outputs)
# original paper Table: 88,448 samples × 18 outputs
# Sources: labevents.csv.gz + d_labitems.csv.gz + chartevents.csv.gz enrich
# Window: ECG-time (closest within ±1 h)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_labvalues_paper_labels.csv
  label_cols:
    - PT
    - Albumin
    - "Anion Gap"
    - Bicarbonate
    - "Bilirubin, Total"
    - "Calcium, Total"
    - Creatinine
    - Ferritin
    - "Urea Nitrogen"
    - Hematocrit
    - Hemoglobin
    - Lymphocytes
    - MCHC
    - RDW
    - "Red Blood Cells"
    - RDW-SD
    - "Creatine Kinase (CK)"
    - NTproBNP
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
task:
  name: mimic_labvalues
  num_classes: 18
  task_type: regression

# MIMIC-IV-ECG Age (regression, years)
# 원본 paper Table: 182,076 samples × 1 output
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_age_paper_labels.csv
  label_cols:
    - age
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_age
  num_classes: 1
  task_type: regression

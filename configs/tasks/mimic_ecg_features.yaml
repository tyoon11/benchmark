# MIMIC-IV-ECG ECG features (regression, 7 outputs)
# original paper Table: 181,989 samples × 7 outputs
# Features: RR, QRS, QT, QTc, P_wave_axis, QRS_axis, T_wave_axis
# original mimic_preprocessing.py as-is — outlier remove after raw value.
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_ecg_features_paper_labels.csv
  label_cols:
    - RR
    - QRS
    - QT
    - QTc
    - P_wave_axis
    - QRS_axis
    - T_wave_axis
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
task:
  name: mimic_ecg_features
  num_classes: 7
  task_type: regression

# sph_diag — SPH (Liu 2022) 35-class multi-label AHA primary diagnosis (min_cnt=10)
# ecg-fm-benchmarking's prepare_data_sph(min_cnt=10) 35 label identical reproduction.
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/sph/v2.0
  label_csv: labels/sph_paper_labels.csv
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/sph/v2.0/sph_table.csv
task:
  name: sph_diag
  num_classes: 35
  expected_num_classes: 35   # main_lite_ecg.py

# CODE-15% Diagnosis (6-class multi-label)
task:
  name: code15_diag
  num_classes: 6
  expected_num_classes: 6   # main_lite_ecg.py

data:
  # original: df[df.data_length >= 4000] (main_lite_ecg.setup_dataset)
  min_data_length: 4000
  h5_root: ${ECG_DATA_ROOT}/h5/code15/v2.0
  table_csv: ${ECG_DATA_ROOT}/h5/code15/v2.0/code15_table.csv
  label_csv: ${ECG_DATA_ROOT}/h5/code15/v2.0/code15_labels.csv
  label_cols:
    - 1dAVb
    - RBBB
    - LBBB
    - is_SB
    - is_STach
    - is_AF
  normalize: true
  batch_size: 128
  num_workers: 8

# EchoNext — matches the original ecg-fm-benchmarking: 11-label multi-label
# (composite shd_moderate_or_greater_flag 11  OR exclude)
# ref: ecg-fm-benchmarking/code/main_lite_ecg.py:65 (num_classes=11)
#      ecg-fm-benchmarking/code/clinical_ts/utils/ecg_utils.py:1344 (lbl_itos)
task:
  name: echonext
  num_classes: 11

data:
  loader_type: echonext_numpy
  metadata_csv: ${ECG_DATA_ROOT}/raw/physionet.org/files/echonext/1.1.0/echonext_metadata_100k.csv
  waveforms:
    train: ${ECG_DATA_ROOT}/raw/physionet.org/files/echonext/1.1.0/EchoNext_train_waveforms.npy
    val:   ${ECG_DATA_ROOT}/raw/physionet.org/files/echonext/1.1.0/EchoNext_val_waveforms.npy
    test:  ${ECG_DATA_ROOT}/raw/physionet.org/files/echonext/1.1.0/EchoNext_test_waveforms.npy
  label_cols:
    - lvef_lte_45_flag
    - lvwt_gte_13_flag
    - aortic_stenosis_moderate_or_greater_flag
    - aortic_regurgitation_moderate_or_greater_flag
    - mitral_regurgitation_moderate_or_greater_flag
    - tricuspid_regurgitation_moderate_or_greater_flag
    - pulmonary_regurgitation_moderate_or_greater_flag
    - rv_systolic_dysfunction_moderate_or_greater_flag
    - pericardial_effusion_moderate_large_flag
    - pasp_gte_45_flag
    - tr_max_gte_32_flag
  split_col: split
  source_fs: 250
  target_fs: 250
  target_length: 2500          # 250Hz × 10s
  normalize: false             # dataset  already z-score normalization 
  layout: NHWC                 # (N, 1, T, C)
  n_leads: 12
  batch_size: 64
  num_workers: 8

# strat_fold  auto_split 
fold:
  auto_split: false

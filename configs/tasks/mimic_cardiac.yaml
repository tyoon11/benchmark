# MIMIC-IV-ECG Cardiac discharge diagnoses (multi-label binary, ICD-10 chapter IX)
# Paper Table: 114,355 samples × 158 outputs
# users results: 116,215 rows × 158 labels (paper +1.6%, output 100% match)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_cardiac_paper_labels.csv
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_cardiac
  num_classes: 158
  task_type: binary

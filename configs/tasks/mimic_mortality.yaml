# MIMIC-IV-ECG Mortality (multi-label binary with NaN, 7 horizons)
# original paper Table: 17,639 samples × 7 outputs (1d/7d/28d/90d/180d/365d/stay)
# Source: mds_ed.csv (multimodal-emergency-benchmark)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_mortality_paper_labels.csv
  label_cols:
    - deterioration_mortality_1d
    - deterioration_mortality_7d
    - deterioration_mortality_28d
    - deterioration_mortality_90d
    - deterioration_mortality_180d
    - deterioration_mortality_365d
    - deterioration_mortality_stay
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
task:
  name: mimic_mortality
  num_classes: 7
  task_type: multi-label-binary  # NaN mask BCE (paper main_lite_ecg.py:114-118)

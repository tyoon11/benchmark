# MIMIC-IV-ECG Clinical deterioration (multi-label binary with NaN, 6 outputs)
# original paper Table: 5,577 samples × 6 outputs
# Source: mds_ed.csv (multimodal-emergency-benchmark)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_deterioration_paper_labels.csv
  label_cols:
    - deterioration_severe_hypoxemia
    - deterioration_ecmo
    - deterioration_vasopressors
    - deterioration_inotropes
    - deterioration_mechanical_ventilation
    - deterioration_cardiac_arrest
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_deterioration
  num_classes: 6
  task_type: multi-label-binary

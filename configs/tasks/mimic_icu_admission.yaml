# MIMIC-IV-ECG ICU admission (multi-label binary with NaN, 2 outputs)
# original paper Table: 18,690 samples × 2 outputs
# Source: mds_ed.csv (multimodal-emergency-benchmark)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_icu_admission_paper_labels.csv
  label_cols:
    - deterioration_icu_24h
    - deterioration_icu_stay
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_icu_admission
  num_classes: 2
  task_type: multi-label-binary

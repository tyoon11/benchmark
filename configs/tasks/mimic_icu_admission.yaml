# MIMIC-IV-ECG ICU admission (binary, simplified — hospital admission proxy)
# 원본 paper Table: 18,690 samples × 2 outputs (ICU-specific from chartevents/mds_ed)
# 사용자 raw에 chartevents.csv.gz / mds_ed.csv 부재 → ED disposition='ADMITTED' OR ecg_taken_in_hosp 으로 대체.
# 정확한 paper 재현이 필요하면 chartevents.csv.gz와 d_items.csv.gz를 다운로드해 ICU stay 추출 필요.
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_icu_admission_paper_labels.csv
  label_cols:
    - is_admitted
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_icu_admission
  num_classes: 1
  task_type: binary

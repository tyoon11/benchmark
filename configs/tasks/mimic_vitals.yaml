# MIMIC-IV-ECG Vital signs (regression, 6 outputs)
# 원본 paper Table: 131,602 samples × 6 outputs
# Sources: vitalsign.csv.gz + chartevents.csv.gz 보강
# Window: ECG-time 기준 closest 1시간 매칭
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_vitals_paper_labels.csv
  label_cols:
    - dbp
    - heartrate
    - o2sat
    - resprate
    - sbp
    - temperature
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
  target_fs: 500
  target_length: 5000
task:
  name: mimic_vitals
  num_classes: 6
  task_type: regression

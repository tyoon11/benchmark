# MIMIC-IV-ECG Non-cardiac discharge diagnoses (multi-label binary, ICD-10 non-IX)
# Paper Table: 178,163 samples × 918 outputs
# users results: 180,710 rows × 918 labels (paper +1.4%, output 100% match)
data:
  batch_size: 64
  h5_root: ${ECG_DATA_ROOT}/h5/mimic4/v2.0
  label_csv: labels/mimic_noncardiac_paper_labels.csv
  normalize: false
  num_workers: 8
  table_csv: ${ECG_DATA_ROOT}/h5/mimic4/v2.0/mimic4_table.csv
task:
  name: mimic_noncardiac
  num_classes: 918
  task_type: binary
